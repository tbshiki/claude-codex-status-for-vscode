name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ジョブ名 build は main の ruleset で必須チェックに指定している。変えるときは ruleset も直す
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # action はコミットの SHA で固定し、版をコメントに書く(Dependabot が両方を更新する)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run package
